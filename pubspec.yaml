name: flutter_e_commerce
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  cached_network_image: ^3.4.1
  carousel_slider_plus: ^7.1.1
  dartz: ^0.10.1
  dio: ^5.9.0
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^10.0.0
  get: ^4.7.3
  go_router: ^17.0.1
  google_fonts: ^8.0.0
  shared_preferences: ^2.5.4
  jwt_decoder: ^2.0.1
  stylish_bottom_bar: ^1.1.1
  sqflite: ^2.4.2
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-VariableFont_wght.ttf
          weight: 900
